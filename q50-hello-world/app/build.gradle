plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.q50dev.hello'

    // Use modern compileSdk for toolchain access,
    // but ONLY use APIs available at runtime level 10
    compileSdk 34

    defaultConfig {
        applicationId "com.q50dev.hello"

        // *** CRITICAL: both must be 10 for Dalvik 2.3 ***
        minSdk 10
        targetSdk 10

        versionCode 1
        versionName "1.0"

        // Dalvik 2.3 does NOT support multidex
        multiDexEnabled false
    }

    compileOptions {
        // Java 8 source for Kotlin stdlib compatibility.
        // D8 built-in desugaring handles lambdas and SAM conversions
        // (invokedynamic → static inner classes) even without
        // coreLibraryDesugaringEnabled. This is sufficient for Kotlin.
        //
        // NOTE: coreLibraryDesugaringEnabled = true CANNOT be used
        // because AGP requires multidex with it, and Dalvik 2.3
        // does NOT support multidex. Avoid Java 8+ standard library
        // APIs (java.time, Streams, Optional) — they won't be available.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled false
        }
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Exclude unnecessary metadata to keep DEX small
    packagingOptions {
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/NOTICE',
                'kotlin/**'
            ]
        }
    }

    // Disable BuildConfig generation (not needed, saves DEX space)
    buildFeatures {
        buildConfig false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // Kotlin stdlib — minimal version.
    // D8 handles lambda desugaring automatically.
    // Do NOT add coreLibraryDesugaring — it requires multidex.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    // ===========================================================
    // *** DO NOT ADD THESE — they CRASH on API 10 ***
    // ===========================================================
    // implementation 'androidx.core:core-ktx:...'          // requires API 14+
    // implementation 'androidx.appcompat:appcompat:...'     // requires API 14+
    // implementation 'com.google.android.material:...'      // requires API 14+
    // implementation 'androidx.lifecycle:...'               // requires API 14+
    // implementation 'androidx.fragment:...'                // requires API 14+
    // implementation 'androidx.constraintlayout:...'        // requires API 14+
    // ===========================================================
}
